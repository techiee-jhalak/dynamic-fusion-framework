[project]
name = "dynamic-fusion-framework"
version = "0.1.0"
description = "Dynamic Noise-Aware Lexicon–Transformer Fusion Framework for Sentiment Analysis of Code-Mixed Social Media Text"
authors = [ { name="Research Group", email="research@example.org" } ]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "See docs/LICENSE.md" }
dependencies = [
  "fastapi>=0.95.0",
  "uvicorn[standard]>=0.22.0",
  "starlette>=0.29.0",
  "pydantic>=2.0",
  "torch>=2.0",
  "transformers>=4.35.0",
  "datasets>=2.12.0",
  "sentencepiece>=0.1.98",
  "scikit-learn>=1.2.0",
  "pandas>=2.0",
  "numpy>=1.25",
  "wandb>=0.15",
  "python-dotenv>=1.0",
  "vaderSentiment>=3.3.2",
  "statsmodels>=0.19",
  "openpyxl>=3.1",
  "scipy>=1.10.0",
  "emoji>=2.4",
  "langdetect>=1.0.9",
  "pyarrow>=12.0",
  "matplotlib>=3.8",
  "seaborn>=0.12",
  "psycopg2-binary>=2.9"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["find:"]
